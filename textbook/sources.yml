# Textbook source manifest
# canonical 노트의 모든 인용은 (source_id, page) 페어 사용. 노트 본문에 raw 파일명·작성자
# 로컬 경로 직접 인용 금지 (CONVENTIONS §4 / G8b). 로컬 경로는 아래 filename 필드 = 레지스트리
# *한 곳*에만 둔다 (canonical 본문이 경로 대신 source_id 를 쓰게 하는 indirection point).
#
# 필드:
#   source_id      안정적 ID (이 wiki 전체에서 고정. 파일 교체 시에도 유지)
#   filename       현 파일명/로컬 원본 위치 — **로컬 경로 레지스트리** (G8b 면제 지점)
#   title          문헌 제목
#   authors        저자 (참고용)
#   edition        판 (없으면 null)
#   year           발행연도 (없으면 null)
#   work_id        (G8c, 선택) bibliographic work 식별. 같은 저작의 다른 포맷·미러 = 같은
#                  work_id + 다른 source_id(alias). 다른 work(에디션·매뉴얼·논문·데이터셋·고시)
#                  = 다른 work_id. 한 source_id 에 이질 출처 뭉치기 방지 (plan.md G8c). 미지정 = source_id 와 동일 취급.
#   format         (G8c, 선택) pdf | html | csv | repo | notice | dataset … (미러 구별)
#   sha256         파일 무결성 체크용 (2026-05-21 계산)
#   bytes          크기 (검증 보조)
#   page_offset    PDF 표시 페이지 ≠ 본문 페이지일 때 보정. 0 이면 일치.
#   topic_primary  주 토픽 분류
#   topics         관련 토픽 리스트
#   notes          비고
#
# 파일 교체 시 갱신 절차:
# 1) 새 PDF의 sha256, bytes 재계산 → sources.yml 갱신
# 2) edition·year 변경 여부 확인. 변경됐으면 edition/year 갱신
# 3) page_offset 재확인 — 판이 바뀐 경우 페이지 번호가 이동했을 수 있음
# 4) **기존 인용의 페이지 검증**: 이 source_id를 인용한 모든 노트 (`rg "source_id: <id>" ~/coastal-wiki/textbook/notes/`)의 frontmatter `citation_status`를 `source-needed`로 강등 → 사용자가 페이지 재대조 후 `verified`로 복원
# 5) commit message: "textbook: update <source_id> source (edition X → Y, citations need re-verify)"
#
# 즉 "sources.yml만 갱신하면 끝"이 아님. 판이 바뀌면 인용 재검증 의무.

