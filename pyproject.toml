[project]
name = "coastal-wiki"
version = "0.1.0"
description = "coastal-wiki — 연안공학 도메인 지식 위키 (단일 writer). Python tools 의존성 매니페스트."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dateutil>=2.8",
    "scipy>=1.11",
    "utide>=0.3.0",
]

[tool.uv]
# 공용 venv 정책: ~/coastal-wiki/.venv (모든 tool 공유)
# 예외 — tool 별 venv 만드는 경우는 버전 충돌 명시될 때만 (feedback_shared_venv 참조)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 위키는 패키지로 빌드하지 않음 — pyproject.toml 은 의존성 매니페스트 역할만
bypass-selection = true
